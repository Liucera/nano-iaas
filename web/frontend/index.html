<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nano-IaaS Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a0c10;
      color: #e2e8f0;
      min-height: 100vh;
    }

    /* ── LOGIN ── */
    #tela-login {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .login-box {
      background: #0d1117;
      border: 1px solid #1e2433;
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 380px;
    }

    .login-logo {
      width: 48px; height: 48px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px;
      margin: 0 auto 20px;
    }

    .login-box h2 {
      text-align: center;
      font-size: 20px;
      font-weight: 600;
      color: #f1f5f9;
      margin-bottom: 6px;
    }

    .login-box p {
      text-align: center;
      font-size: 13px;
      color: #475569;
      margin-bottom: 28px;
    }

    .campo {
      margin-bottom: 16px;
    }

    .campo label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: #64748b;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .campo input {
      width: 100%;
      background: #111520;
      border: 1px solid #1e2433;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 14px;
      color: #e2e8f0;
      outline: none;
      transition: border-color 0.15s;
    }

    .campo input:focus { border-color: #3b82f6; }

    .btn-login {
      width: 100%;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 11px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: opacity 0.15s;
    }

    .btn-login:hover { opacity: 0.9; }

    .erro-login {
      background: #1f0a0a;
      border: 1px solid #7f1d1d;
      color: #ef4444;
      font-size: 13px;
      padding: 10px 14px;
      border-radius: 8px;
      margin-top: 14px;
      display: none;
    }

    /* ── DASHBOARD ── */
    #tela-dashboard {
      display: none;
      padding: 32px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 32px;
      padding-bottom: 24px;
      border-bottom: 1px solid #1e2433;
    }

    .header-left { display: flex; align-items: center; gap: 12px; }

    .logo {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
    }

    header h1 { font-size: 20px; font-weight: 600; color: #f1f5f9; }

    .badge {
      background: #1e2433;
      color: #64748b;
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 20px;
      border: 1px solid #2d3748;
    }

    .btn-logout {
      background: #1a0a0a;
      border: 1px solid #7f1d1d;
      color: #ef4444;
      font-size: 12px;
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    .btn-logout:hover { opacity: 0.8; }

    .counters {
      display: flex;
      gap: 16px;
      margin-bottom: 28px;
    }

    .counter-card {
      background: #111520;
      border: 1px solid #1e2433;
      border-radius: 12px;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 180px;
    }

    .counter-icon {
      width: 40px; height: 40px;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
    }

    .counter-icon.gcp   { background: #1a2535; }
    .counter-icon.azure { background: #111e35; }
    .counter-icon.total { background: #1a1535; }
    .counter-icon.aws   { background: #2d1a00; }

    .counter-num   { font-size: 24px; font-weight: 700; color: #f1f5f9; line-height: 1; }
    .counter-label { font-size: 12px; color: #475569; margin-top: 4px; }

    .providers { display: flex; gap: 10px; margin-bottom: 24px; }

    .btn {
      display: flex; align-items: center; gap: 8px;
      padding: 9px 20px;
      border: 1px solid transparent;
      border-radius: 8px;
      font-size: 13px; font-weight: 500;
      cursor: pointer; transition: all 0.15s;
    }

    .btn-gcp   { background: #1a2535; color: #7dd3fc; border-color: #1e3a5f; }
    .btn-gcp:hover { background: #1e2e42; border-color: #2563eb; }
    .btn-azure { background: #111e35; color: #93c5fd; border-color: #1e3050; }
    .btn-azure:hover { background: #162040; border-color: #3b82f6; }
    .btn-aws { background: #2d1a00; color: #fb923c; border-color: #92400e; }
    .btn-aws:hover { background: #3d2200; border-color: #f97316; }
    .btn-all   { background: #1a1535; color: #c4b5fd; border-color: #2d2050; }
    .btn-all:hover { background: #1e1a42; border-color: #7c3aed; }

    .status {
      font-size: 13px; color: #475569;
      margin-bottom: 16px; min-height: 18px;
    }
    .status.loading { color: #f59e0b; }
    .status.success { color: #10b981; }
    .status.error   { color: #ef4444; }

    .table-wrap {
      background: #0d1117;
      border: 1px solid #1e2433;
      border-radius: 12px;
      overflow: hidden;
    }

    table { width: 100%; border-collapse: collapse; }
    thead tr { background: #111520; }

    th {
      text-align: left; padding: 12px 20px;
      font-size: 11px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.08em;
      color: #374151; border-bottom: 1px solid #1e2433;
    }

    td {
      padding: 13px 20px; font-size: 13px;
      color: #94a3b8; border-bottom: 1px solid #111520;
    }

    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #0f1420; color: #cbd5e1; }

    .provider-cell { display: flex; align-items: center; gap: 8px; }
    .provider-name { font-size: 12px; font-weight: 600; color: #64748b; }

    .type-badge {
      display: inline-block; padding: 2px 10px;
      border-radius: 20px; font-size: 11px; font-weight: 500;
    }
    .type-bucket    { background: #14532d33; color: #4ade80; border: 1px solid #14532d; }
    .type-container { background: #1e1b4b33; color: #a5b4fc; border: 1px solid #1e1b4b; }

    .resource-name { color: #e2e8f0; font-weight: 500; }
    .date-cell { font-family: monospace; font-size: 12px; color: #475569; }

    .empty { text-align: center; padding: 60px; color: #1e2433; font-size: 14px; }
  </style>
</head>
<body>

  <!-- TELA DE LOGIN -->
  <div id="tela-login">
    <div class="login-box">
      <div class="login-logo">☁</div>
      <h2>Nano-IaaS</h2>
      <p>Faça login para acessar o dashboard</p>

      <div class="campo">
        <label>Usuário</label>
        <input type="text" id="input-usuario" placeholder="admin" />
      </div>

      <div class="campo">
        <label>Senha</label>
        <input type="password" id="input-senha" placeholder="••••••••"
               onkeydown="if(event.key==='Enter') fazerLogin()" />
      </div>

      <button class="btn-login" onclick="fazerLogin()">Entrar</button>
      <div class="erro-login" id="erro-login">Usuário ou senha incorretos.</div>
    </div>
  </div>

  <!-- TELA DO DASHBOARD -->
  <div id="tela-dashboard">
    <header>
      <div class="header-left">
        <div class="logo">☁</div>
        <h1>Nano-IaaS Dashboard</h1>
        <span class="badge">Multi-Cloud Explorer</span>
      </div>
      <button class="btn-logout" onclick="fazerLogout()">Sair</button>
    </header>

    <div class="counters">
      <div class="counter-card">
        <div class="counter-icon gcp">🔵</div>
        <div>
          <div class="counter-num" id="cnt-gcp">—</div>
          <div class="counter-label">Google Cloud</div>
        </div>
      </div>
      <div class="counter-card">
        <div class="counter-icon azure">🔷</div>
        <div>
          <div class="counter-num" id="cnt-azure">—</div>
          <div class="counter-label">Azure</div>
        </div>
      </div>
      <div class="counter-card">
        <div class="counter-icon aws">🟠</div>
        <div>
          <div class="counter-num" id="cnt-aws">—</div>
          <div class="counter-label">AWS</div>
        </div>
      </div>
      <div class="counter-card">
        <div class="counter-icon total">⚡</div>
        <div>
          <div class="counter-num" id="cnt-total">—</div>
          <div class="counter-label">Total de recursos</div>
        </div>
      </div>
    </div>

    <div class="providers">
      <button class="btn btn-gcp" onclick="carregar('gcp')">🔵 Google Cloud</button>
      <button class="btn btn-azure" onclick="carregar('azure')">🔷 Azure</button>
      <button class="btn btn-aws" onclick="carregar('aws')">🟠 AWS</button>
      <button class="btn btn-all" onclick="carregarTodos()">⚡ Todos</button>
    </div>

    <div class="status" id="status">Selecione um provider para começar.</div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Provider</th>
            <th>Nome</th>
            <th>Tipo</th>
            <th>Localização / Modificado</th>
            <th>Criado</th>
          </tr>
        </thead>
        <tbody id="corpo">
          <tr><td colspan="5" class="empty">Nenhum dado carregado ainda.</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const API = 'http://127.0.0.1:8000';
    const counts = { gcp: 0, azure: 0, aws: 0 };
    let token = null;

    function setStatus(msg, tipo) {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.className = 'status ' + (tipo || '');
    }

    function formatDate(str) {
      if (!str || str === '—') return '—';
      try {
        return new Date(str).toLocaleDateString('pt-BR', {
          day: '2-digit', month: 'short', year: 'numeric'
        });
      } catch { return str; }
    }

    async function fazerLogin() {
      const usuario = document.getElementById('input-usuario').value;
      const senha = document.getElementById('input-senha').value;
      const erro = document.getElementById('erro-login');
      erro.style.display = 'none';

      try {
        const res = await fetch(`${API}/login`, {
          method: 'POST',
        body: (() => { const f = new FormData(); f.append('username', usuario); f.append('password', senha); return f; })()
        });

        const data = await res.json();

        if (!res.ok) throw new Error(data.detail);

        token = data.access_token;
        document.getElementById('tela-login').style.display = 'none';
        document.getElementById('tela-dashboard').style.display = 'block';
        carregarTodos();
      } catch (e) {
        erro.style.display = 'block';
      }
    }

    function fazerLogout() {
      token = null;
      document.getElementById('tela-login').style.display = 'flex';
      document.getElementById('tela-dashboard').style.display = 'none';
      document.getElementById('input-senha').value = '';
    }

    function atualizarContadores() {
      document.getElementById('cnt-gcp').textContent = counts.gcp || '—';
      document.getElementById('cnt-azure').textContent = counts.azure || '—';
      const total = counts.gcp + counts.azure;
      document.getElementById('cnt-total').textContent = total || '—';
    }

    async function carregar(provider) {
      setStatus(`Carregando ${provider.toUpperCase()}...`, 'loading');
      try {
        const res = await fetch(`${API}/list/${provider}`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error);
        counts[provider] = data.resources.length;
        atualizarContadores();
        renderizar([{ provider, resources: data.resources }]);
        setStatus(`✅ ${data.resources.length} recursos carregados — ${provider.toUpperCase()}`, 'success');
      } catch (e) {
        setStatus(`❌ Erro: ${e.message}`, 'error');
      }
    }

    async function carregarTodos() {
      setStatus('Carregando todos os providers...', 'loading');
      try {
      const [gcp, azure, aws] = await Promise.all([
        fetch(`${API}/list/gcp`, { headers: { 'Authorization': `Bearer ${token}` } }).then(r => r.json()),
        fetch(`${API}/list/azure`, { headers: { 'Authorization': `Bearer ${token}` } }).then(r => r.json()),
        fetch(`${API}/list/aws`, { headers: { 'Authorization': `Bearer ${token}` } }).then(r => r.json()),
      ]);
      counts.gcp = gcp.resources.length;
      counts.azure = azure.resources.length;
      counts.aws = aws.resources.length;
      atualizarContadores();
      renderizar([
        { provider: 'gcp', resources: gcp.resources },
        { provider: 'azure', resources: azure.resources },
        { provider: 'aws', resources: aws.resources },
     ]);
     const total = gcp.resources.length + azure.resources.length + aws.resources.length;
        setStatus(`✅ ${total} recursos carregados — GCP + Azure`, 'success');
      } catch (e) {
        setStatus(`❌ Erro: ${e.message}`, 'error');
      }
    }

    function renderizar(providers) {
      const corpo = document.getElementById('corpo');
      corpo.innerHTML = '';
      const icones = { gcp: '🔵', azure: '🔷', aws: '🟠' };
      providers.forEach(({ provider, resources }) => {
        resources.forEach(r => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td><div class="provider-cell">
              <span>${icones[provider]}</span>
              <span class="provider-name">${provider.toUpperCase()}</span>
            </div></td>
            <td class="resource-name">${r.name}</td>
            <td><span class="type-badge type-${r.type}">${r.type}</span></td>
            <td class="date-cell">${r.location || formatDate(r.last_modified) || '—'}</td>
            <td class="date-cell">${formatDate(r.created) || '—'}</td>
          `;
          corpo.appendChild(tr);
        });
      });
    }
  </script>

</body>
</html>
